    external_drain:        "⏳ 此代理正在为维护操作排空，暂时不接受新的轮次。稍后就会恢复——请稍候重发。"
    update_send_failed:    "✗ 向更新进程发送响应失败：{error}"
    update_sent:           "✓ 已将 `{label}` 发送给更新进程。"
    skill_installed_disabled: "**{name}** 技能已安装但被禁用。\n启用命令：`hermes skills config`"
    skill_not_installed:   "**{name}** 技能可用但尚未安装。\n安装命令：`hermes skills install {install_path}`"
    skill_disabled:        "**{name}** 技能在 {platform} 上已被禁用。\n启用命令：`hermes skills config`"
    skills_disabled_stacked: "本次堆叠调用中的 **{names}** 技能在 {platform} 上已被禁用。\n启用命令：`hermes skills config`"
    stacked_load_failed:   "为 /{command} 加载堆叠技能失败。"
    unknown_command:       "未知命令 `/{command}`。输入 /commands 查看可用命令，或去掉开头的斜杠作为普通消息重新发送。"

  # 绕过代理循环的用户自定义快捷命令（exec/alias）。
  quick_command:
    no_output:             "命令没有返回任何输出。"
    timed_out:             "快捷命令超时（30 秒）。"
    error:                 "快捷命令出错：{error}"
    no_command:            "快捷命令 '/{command}' 未定义 command。"
    no_target:             "快捷命令 '/{command}' 未定义 target。"
    bad_type:              "快捷命令 '/{command}' 类型不受支持（支持：'exec'、'alias'）。"

  session:
    active_limit:          "Hermes 已达到活跃会话上限（{active}/{maximum}）。请在其他会话结束后重试。"

  # 非管理员运行仅管理员可用的斜杠命令时的拒绝提示。
  slash_access:
    can_run_suffix:        "你可以运行：{commands}。使用 /whoami 查看完整列表。"
    none_suffix:           "此平台上未对非管理员启用任何斜杠命令。请让管理员将你加入 allow_admin_from，或设置 user_allowed_commands。"
    admin_only:            "⛔ /{command} 在此仅限管理员使用。{suffix}"

  # 破坏性会话命令（/new、/reset、/undo）的确认提示。
  slash_confirm:
    undo_detail_one:       "这将从历史中移除最近一轮用户/助手对话。"
    undo_detail_n:         "这将从历史中移除最近 {count} 轮用户对话。"
    cancelled:             "🟡 /{command} 已取消。对话未改变。"
    always_note:           "\n\nℹ️ 今后 /clear、/new、/reset 和 /undo 将无需确认直接运行。可在 config.yaml 中通过 `approvals.destructive_slash_confirm: true` 重新启用。"
    prompt:                "⚠️ **确认 /{command}**\n\n{detail}\n\n请选择：\n• **仅批准一次** — 仅本次执行\n• **始终批准** — 执行并永久关闭此提示\n• **取消** — 保留当前对话\n\n_文本回退：回复 `{prefix}approve`、`{prefix}always` 或 `{prefix}cancel`。_"

  suggestions:
    command_failed:        "建议命令失败：{error}"

  blueprint:
    command_failed:        "Cron 蓝图命令失败：{error}"

  # 由原始 provider/API 错误映射出的用户安全回复（_gateway_provider_error_reply、
  # run_sync）。原始 provider 细节仅保留在日志中，不进入聊天。
  provider_error:
    auth_failed:           "⚠️ Provider 身份验证失败。请检查所配置的凭据；原始 provider 细节见网关日志。"
    policy_rejected:       "⚠️ 模型 provider 拒绝了该请求。我未将原始 provider 错误放入聊天；详情请查看网关日志，或尝试换个说法。"
    rate_limited:          "⏱️ 模型 provider 正在限流。请稍候片刻后重试。"
    failed_after_retries:  "⚠️ 模型 provider 多次重试后仍失败。我未将原始 provider 细节放入聊天；诊断信息请查看网关日志。"
    auth_failed_detail:    "⚠️ Provider 身份验证失败：{error}"

  # 当某一轮未产生可用回复时的回退提示（_normalize_empty_agent_response）。
  session_error:
    context_too_large:     "⚠️ 会话过大，超出模型的上下文窗口。\n使用 /compact 压缩对话，或使用 /reset 重新开始。"
    request_failed:        "请求失败：{error}\n请重试，或使用 /reset 开启新会话。"
    interrupted_before_start: "⚠️ 你的消息在开始处理前被中断（很可能是由于最近的 /stop）。请重新发送。"
    processing_stopped:    "⚠️ 处理已停止：{error}。请重试。"
    no_response_generated: "⚠️ 处理已完成但未生成任何回复。这可能是一次瞬时错误——请重新发送你的消息。"
    not_processed:         "⚠️ 你的消息未被处理（上一轮仍在清理中）。请重新发送。"

  # 追加到通用代理异常回复后的 HTTP 状态提示（_handle_message_with_agent）。
  # 每条提示以一个前导空格开头，以便拼接在基础句子之后。
  agent_error:
    hint_401:              " 请检查你的 API key，或运行 `claude /login` 刷新 OAuth 凭据。"
    hint_402:              " 你的 API 余额或额度已耗尽。请查看你的 provider 控制台。"
    hint_usage_limit_reset: " 你的套餐用量已达上限。约 {hours} 小时后重置。"
    hint_usage_limit:      " 你的套餐用量已达上限。请等待其重置。"
    hint_rate_limited:     " 你正在被限流。请稍候片刻后重试。"
    hint_overloaded:       " API 暂时过载。请稍后重试。"
    hint_rejected:         " 该请求被 API 拒绝。"
    unexpected:            "抱歉，我遇到了一个意外错误。{status_hint}\n请重试，或使用 /reset 开启新会话。"

  # 远程代理模式的错误（_run_agent_via_proxy）。
  proxy:
    requires_aiohttp:      "⚠️ 代理模式需要 aiohttp。安装命令：pip install aiohttp"
    url_not_configured:    "⚠️ 未配置代理 URL（GATEWAY_PROXY_URL 或 gateway.proxy_url）"
    error:                 "⚠️ 代理错误（{status}）：{detail}"
    connection_error:      "⚠️ 代理连接错误：{error}"
    no_response:           "（远程代理未返回任何回复）"

  shared:
    session_db_unavailable:      "会话数据库不可用。"
    session_db_unavailable_prefix: "会话数据库不可用"
    session_not_found:           "数据库中未找到该会话。"
    warn_passthrough:            "⚠️ {error}"
